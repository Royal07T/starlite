name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  laravel:
    name: Laravel (tests + lint)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: starlite_test
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, zip, intl, gd, pdo_mysql, bcmath, exif, pcntl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate

      - name: Pint (style)
        # Legacy monolith is not fully Pint-clean yet; swap to blocking once Phase 2 lands.
        continue-on-error: true
        run: vendor/bin/pint --test

      - name: Run tests (MySQL)
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: starlite_test
          DB_USERNAME: root
          DB_PASSWORD: ''
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: php artisan test

  ai-service:
    name: FastAPI AI service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai_assistant/requirements.txt

      - name: Install dependencies
        working-directory: ai_assistant
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: ai_assistant
        env:
          AI_SERVICE_TOKEN: test-service-token
        run: python -m pytest tests -q